name: Inspection tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show runtime
        run: python3 --version
      - name: Test generated fixtures and invalid inputs
        run: python3 -m unittest discover -s tests -v
      - name: Check CLI
        run: python3 -m vesktop_android --version
      - name: Keep proprietary inputs out of tracked source
        run: python3 tools/check-source.py
